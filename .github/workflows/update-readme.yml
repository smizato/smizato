name: Update README

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 1 * *" # Rodar às 00:00 do dia 1 de cada mês
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/update-readme.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update years of experience
        run: |
          START_YEAR=2005
          START_MONTH=5
          NOW_YEAR=$(date +%Y)
          NOW_MONTH=$(date +%m)

          # Remove zeros à esquerda caso existam
          NOW_YEAR=$((10#$NOW_YEAR))
          NOW_MONTH=$((10#$NOW_MONTH))

          YEARS=$((NOW_YEAR - START_YEAR))
          if [ "$NOW_MONTH" -lt "$START_MONTH" ]; then
            YEARS=$((YEARS - 1))
          fi

          echo "Calculated years of experience: $YEARS"

          # 1. Se existir placeholder solto sem marcadores, converte para marcadores HTML
          sed -i -E "s/(\{experience-years\}|\{\{years_experience\}\})/<!--experience-years-->${YEARS}<!--\/experience-years-->/g" README.md

          # 2. Atualiza o conteúdo dentro dos marcadores preservando as tags invisíveis
          sed -i -E "s/<!--experience-years-->.*<!--\/experience-years-->/<!--experience-years-->${YEARS}<!--\/experience-years-->/g" README.md

      - name: Update last updated date
        run: |
          export TZ="America/Sao_Paulo"
          DATE=$(date +"%d/%m/%Y %H:%M:%S")

          echo "Updating last updated date to: $DATE"
          
          # Atualiza a data de última atualização no README.md
          sed -i -E "s/<!--LAST_UPDATED-->.*<!--LAST_UPDATED-->/<!--LAST_UPDATED-->$DATE<!--LAST_UPDATED-->/" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git commit -m "Update years of experience" README.md && git push)
